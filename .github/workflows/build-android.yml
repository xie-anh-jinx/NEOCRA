name: Build NEOCRA Android (.apk — aarch64)

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Pre-installed Android SDK & NDK
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          NDK_DIR="$SDK_DIR/ndk/27.2.12479018"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Frontend Dependencies & Build Static Export
        working-directory: frontend
        env:
          TAURI_BUILD: "true"
          NEXT_PUBLIC_API_URL: https://neocra.pengajaran.com
          NEXT_PUBLIC_FASTAPI_URL: https://warehouse.pengajaran.com/api
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Initialize & Build Android APK (aarch64)
        run: |
          npm install
          npm run tauri -- android init --ci
          npm run tauri -- icon src-tauri/icons/icon.png
          npm run tauri -- android build --apk --target aarch64

      - name: Sign & Package NEOCRA-android.apk
        run: |
          mkdir -p dist-android
          UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release-unsigned.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found APK: $UNSIGNED_APK"

          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > neocra-release.keystore
            KS_PASS="${{ secrets.ANDROID_STORE_PASSWORD }}"
            KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
            KEY_PASS="${{ secrets.ANDROID_KEY_PASSWORD }}"
          else
            keytool -genkey -v -keystore neocra-release.keystore \
              -alias neocra -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass neocra2026 -keypass neocra2026 \
              -dname "CN=PT Cahaya Resource Abadi, OU=IT, O=CRA, L=Balikpapan, ST=Kalimantan Timur, C=ID"
            KS_PASS="neocra2026"
            KEY_ALIAS="neocra"
            KEY_PASS="neocra2026"
          fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -f 4 "$UNSIGNED_APK" dist-android/NEOCRA-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks neocra-release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out dist-android/NEOCRA-android.apk \
            dist-android/NEOCRA-aligned.apk
          "$BUILD_TOOLS/apksigner" verify dist-android/NEOCRA-android.apk
          ls -lh dist-android/NEOCRA-android.apk

      - name: Upload Signed Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEOCRA-android-apk
          path: dist-android/NEOCRA-android.apk
