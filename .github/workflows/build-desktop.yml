name: Build NEOCRA Desktop (Windows .exe)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies & Build Static Export
        working-directory: frontend
        env:
          TAURI_BUILD: "true"
          NEXT_PUBLIC_API_URL: https://neocra.pengajaran.com
          NEXT_PUBLIC_FASTAPI_URL: https://warehouse.pengajaran.com/api
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Root Tauri CLI
        run: npm install

      - name: Build Tauri Windows Installer (NEOCRA.exe)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: v__VERSION__
          releaseName: "NEOCRA Desktop v__VERSION__"
          releaseDraft: true
          prerelease: false

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEOCRA-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
