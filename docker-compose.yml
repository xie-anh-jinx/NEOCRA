services:
  postgres:
    image: postgres:15-alpine
    container_name: neocra-postgres
    environment:
      POSTGRES_USER: bdcpa
      POSTGRES_PASSWORD: "4znh.eW@,-"
      POSTGRES_DB: cra
    ports:
      - "5435:5432"
    volumes:
      - neocra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bdcpa -d cra"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: neocra-redis
    ports:
      - "6380:6379"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: neocra-backend
    env_file:
      - ./backend/.env
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://neocra.pengajaran.com
    container_name: neocra-frontend
    environment:
      NEXT_PUBLIC_API_URL: https://neocra.pengajaran.com
    ports:
      - "3010:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  neocra_pgdata:
