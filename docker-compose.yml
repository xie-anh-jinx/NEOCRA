services:
  redis:
    image: redis:7-alpine
    container_name: neocra-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: neocra-backend
    env_file:
      - ./backend/.env
    environment:
      # Uses the existing CRA PostgreSQL database on the host.
      DATABASE_URL: ${DATABASE_URL:-postgres://bdcpa:change-me@host.docker.internal:5432/cra}
      REDIS_URL: redis://redis:6379
      PORT: 8080
      CORS_ORIGINS: http://localhost:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: neocra-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
