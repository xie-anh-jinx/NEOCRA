[package]
name = "neocra-backend"
version = "0.1.0"
edition = "2021"
description = "NEOCRA ERP Backend API (Rust + Axum + SQLx)"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }

# Database & Migrations
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "rust_decimal", "migrate", "json"] }

# Serialization & Types
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rust_decimal = { version = "1", features = ["serde", "serde-with-float"] }

# Validation
validator = { version = "0.20", features = ["derive"] }

# Auth & Cryptography
jsonwebtoken = "9"
argon2 = "0.5"
md-5 = "0.10"

# OpenAPI Documentation
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }

# Logging & Error Handling
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"

# Configuration
config = "0.14"
dotenvy = "0.15"

# Redis / Queue (optional at runtime)
redis = { version = "0.27", features = ["tokio-comp"] }
percent-encoding = "2"
tokio-stream = { version = "0.1", features = ["sync"] }
